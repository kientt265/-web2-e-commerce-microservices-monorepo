# External Secrets Operator Helm Values
# Đã tích hợp fix IRSA và URL encoding - không cần script sửa lỗi thủ công

installCRDs: true

serviceAccount:
  name: external-secrets
  # IRSA annotation sẽ được tự động thêm bởi Terraform
  annotations: {}
  
# Cấu hình webhook với IRSA
webhook:
  serviceAccount:
    name: external-secrets-webhook
    # IRSA annotation sẽ được tự động thêm bởi Terraform
    annotations: {}
    
# Cấu hình certController với IRSA
certController:
  serviceAccount:
    name: external-secrets-cert-controller
    # IRSA annotation sẽ được tự động thêm bởi Terraform
    annotations: {}

# Cấu hình metrics
serviceMonitor:
  enabled: false
  
# Resources configuration
resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 100m
    memory: 128Mi

# Node selector
nodeSelector:
  workload_type: stateful

# Tolerations
tolerations: []

# Affinity
affinity: {}

# Security context
securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

# Cấu hình CRD conversion (để tránh lỗi conversion webhook)
crds:
  conversion:
    enabled: true

# Cấu hình log level để debug nếu cần
log:
  level: info

# Cấu hình leader election (để tránh conflict trong multi-replica)
leaderElect: true