# External Secrets Operator Helm Values
# Tự động cấu hình IRSA cho EKS

installCRDs: true

serviceAccount:
  # Tự động thêm IRSA annotation
  annotations:
    eks.amazonaws.com/role-arn: ""  # Sẽ được thay thế bằng Terraform
  
# Cấu hình webhook
webhook:
  serviceAccount:
    annotations: {}
    
# Cấu hình certController
certController:
  serviceAccount:
    annotations: {}

# Cấu hình metrics
serviceMonitor:
  enabled: false
  
# Resources configuration
resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 100m
    memory: 128Mi

# Node selector
nodeSelector:
  workload_type: stateful

# Tolerations
tolerations: []

# Affinity
affinity: {}

# Security context
securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000